<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalMind — LM Studio Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout" id="layout">
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
    <aside id="sidebar" class="sidebar" aria-label="Conversations">
      <div class="sidebar-header">
        <button id="new-chat" class="new-chat-button" type="button">＋ New chat</button>
        <input type="search" id="conversation-search" class="conversation-search"
               placeholder="🔍 Search chats…" aria-label="Search conversations" autocomplete="off">
      </div>
      <ul id="conversation-list" class="conversation-list"></ul>
      <p class="sidebar-hint">Double-click a chat to rename it</p>
    </aside>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <button id="sidebar-toggle" class="icon-button" type="button"
                title="Toggle conversation list" aria-label="Toggle conversation list">☰</button>
        <span class="brand-dot"></span>
        <h1>LocalMind</h1>
      </div>

      <div class="topbar-controls">
        <label class="model-select-wrap">
          <span class="control-label">Model</span>
          <select id="model-select" disabled>
            <option value="">Loading models…</option>
          </select>
        </label>
        <button id="models-toggle" class="icon-button" type="button"
                title="Manage models" aria-label="Toggle model management panel">📦</button>
        <button id="settings-toggle" class="icon-button" type="button"
                title="Settings" aria-label="Toggle settings panel">⚙</button>
        <button id="clear-chat" class="icon-button" type="button"
                title="New chat" aria-label="Clear conversation">🗑</button>
      </div>
    </header>

    <div id="error-banner" class="error-banner hidden" role="alert">
      <span id="error-text"></span>
      <button id="error-retry" type="button">Retry</button>
      <button id="error-dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>

    <aside id="settings-panel" class="settings-panel hidden" aria-label="Generation settings">
      <h2>Generation Settings</h2>
      <div class="setting">
        <label for="temperature">
          Temperature <span id="temperature-value" class="setting-value">0.7</span>
        </label>
        <input type="range" id="temperature" min="0" max="2" step="0.05" value="0.7">
      </div>
      <div class="setting">
        <label for="max-tokens">Max tokens</label>
        <input type="number" id="max-tokens" min="1" max="131072" step="1" value="1024">
      </div>
      <div class="setting">
        <label for="image-size">Image size</label>
        <select id="image-size">
          <option value="512x512">512 × 512</option>
          <option value="768x768">768 × 768</option>
          <option value="1024x1024" selected>1024 × 1024</option>
          <option value="1024x1536">1024 × 1536 (portrait)</option>
          <option value="1536x1024">1536 × 1024 (landscape)</option>
        </select>
      </div>
    </aside>

    <aside id="models-panel" class="models-panel hidden" aria-label="Model management">
      <div class="models-panel-header">
        <h2>Model Management</h2>
        <div class="models-panel-actions">
          <button id="models-refresh" class="small-button" type="button">↻ Refresh</button>
          <button id="unload-all" class="small-button danger" type="button">Unload all</button>
        </div>
      </div>

      <div class="load-options">
        <label class="load-option checkbox-option">
          <input type="checkbox" id="ttl-enabled" checked>
          Auto-unload after idle
        </label>
        <label class="load-option">
          TTL (seconds)
          <input type="number" id="ttl-seconds" min="1" step="1" value="600">
        </label>
        <label class="load-option">
          Context length
          <input type="number" id="context-length" min="1" step="1"
                 placeholder="model default">
        </label>
      </div>

      <ul id="models-list" class="models-list">
        <li class="models-placeholder">Loading model status…</li>
      </ul>
      <p id="models-summary" class="models-summary"></p>
    </aside>

    <main id="chat-window" class="chat-window" aria-live="polite">
      <div id="empty-state" class="empty-state">
        <p>👋 Select a model and start chatting with your local LLM.</p>
      </div>
    </main>

    <footer class="composer" id="composer">
      <div id="composer-controls" class="composer-controls">
        <label class="composer-control" for="thinking-mode">
          💭 Thinking
          <select id="thinking-mode">
            <option value="" selected>Default</option>
            <option value="on">On</option>
            <option value="off">Off</option>
          </select>
        </label>
        <label class="composer-control" for="effort-level">
          Effort
          <select id="effort-level" disabled title="Effort applies when thinking is On">
            <option value="minimal">Minimal</option>
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="xhigh">Extra high</option>
          </select>
        </label>
      </div>
      <div id="image-options" class="image-options hidden">
        <label class="enhance-toggle"
               title="Rewrite your idea into a detailed image prompt with the selected chat model before generating">
          <input type="checkbox" id="enhance-prompt" checked>
          ✨ Enhance prompt with <span id="enhance-model-label">the selected model</span>
        </label>
      </div>
      <div id="attachments-bar" class="attachments-bar hidden"></div>
      <button id="attach-button" class="icon-button" type="button"
              title="Attach files or images" aria-label="Attach files or images">📎</button>
      <input type="file" id="file-input" multiple hidden
             accept=".pdf,.txt,.md,.markdown,.rst,.csv,.tsv,.json,.yaml,.yml,.toml,.ini,.conf,.log,.xml,.html,.css,.js,.ts,.py,.java,.c,.cpp,.h,.hpp,.go,.rs,.rb,.php,.sh,.sql,image/*">
      <button id="image-toggle" class="icon-button hidden" type="button"
              title="Image generation mode" aria-label="Toggle image generation mode">🎨</button>
      <textarea id="message-input" rows="1"
                placeholder="Type a message… (Enter to send, Shift+Enter for a new line)"
                aria-label="Message"></textarea>
      <button id="send-button" type="button" disabled>Send</button>
    </footer>
  </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="/static/script.js"></script>
</body>
</html>
